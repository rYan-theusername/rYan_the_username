---
layout: default
---
<article class="review">
  <header class="review-header">
    <h1>{{ page.title }}</h1>
    <p class="meta">
      {{ page.book_author }}
      {% if page.date %} · {{ page.date | date: "%B %Y" }}{% endif %}
    </p>
  </header>
  {{ content }}
  <p class="back"><a href="{{ '/reviews/' | relative_url }}">All reviews</a></p>
</article>
